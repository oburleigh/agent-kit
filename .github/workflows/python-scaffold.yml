name: Python scaffold

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths:
      - "plugins/python-scaffold/skills/**"
      - "skills/python-scaffold/**"
      - ".github/workflows/python-scaffold.yml"

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect Python scaffold changes
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.force.outputs.relevant || steps.filter.outputs.relevant }}
    steps:
      - name: Force validation for manual runs
        id: force
        if: github.event_name == 'workflow_dispatch'
        run: echo "relevant=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: github.event_name == 'push'
      - name: Detect relevant files
        id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            relevant:
              - 'skills/python-scaffold/**'
              - 'plugins/python-scaffold/skills/python-scaffold/**'
              - '.github/workflows/python-scaffold.yml'

  verify:
    name: Python validation
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skills/python-scaffold
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
          python-version: "3.14"
          enable-cache: true
          working-directory: skills/python-scaffold
      - run: uv sync --frozen
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen ty check
      - name: Check generated schema
        run: |
          uv run --frozen python scripts/export_schema.py
          git diff --exit-code -- src/python_scaffold/config/schema.json
      - run: uv run --frozen pytest --cov=python_scaffold --cov-branch --cov-fail-under=80
      - name: Build and smoke-test the wheel
        run: |
          uv build --out-dir "${RUNNER_TEMP}/python-scaffold-dist"
          uv run --isolated --no-project \
            --with "${RUNNER_TEMP}"/python-scaffold-dist/*.whl \
            python -c 'from python_scaffold.profiles import load_bundled_preset; assert load_bundled_preset("library")["preset"] == "library"'

  create-only-portability:
    name: Python create-only portability (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: skills/python-scaffold
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
          python-version: "3.14"
          enable-cache: true
          working-directory: skills/python-scaffold
      - run: uv sync --frozen
      - name: Check create-only transaction behavior
        run: >-
          uv run --frozen pytest
          tests/test_transaction.py::test_target_created_at_commit_is_not_replaced
          tests/test_transaction.py::test_success_atomically_moves_the_complete_staging_directory

  required:
    name: Python scaffold
    if: always()
    needs:
      - changes
      - verify
      - create-only-portability
    runs-on: ubuntu-latest
    steps:
      - name: Require successful Python jobs
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          RELEVANT: ${{ needs.changes.outputs.relevant }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          PORTABILITY_RESULT: ${{ needs.create-only-portability.result }}
        run: |
          test "$CHANGES_RESULT" = "success"
          if [[ "$RELEVANT" == "false" ]]; then
            exit 0
          fi
          test "$RELEVANT" = "true"
          test "$VERIFY_RESULT" = "success"
          test "$PORTABILITY_RESULT" = "success"
