name: TypeScript scaffold

on:
  pull_request:
    paths:
      - "skills/typescript-scaffold/**"
      - ".github/workflows/typescript-scaffold.yml"
  push:
    branches: [main]
    paths:
      - "skills/typescript-scaffold/**"
      - ".github/workflows/typescript-scaffold.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skills/typescript-scaffold
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: skills/typescript-scaffold/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run typecheck
      - run: npm run check:dist
