name: TypeScript scaffold

on:
  pull_request:
    paths:
      - "plugins/typescript-scaffold/**"
      - ".github/workflows/typescript-scaffold.yml"
  push:
    branches: [main]
    paths:
      - "plugins/typescript-scaffold/**"
      - ".github/workflows/typescript-scaffold.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/typescript-scaffold/skills/typescript-scaffold
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: plugins/typescript-scaffold/skills/typescript-scaffold/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run typecheck
      - run: npm run check:dist
