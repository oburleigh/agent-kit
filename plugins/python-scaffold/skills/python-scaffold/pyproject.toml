[project]
name = "agent-kit-python-scaffold"
version = "0.1.0"
description = "Configurable create-only Python repository scaffold"
requires-python = ">=3.14"
dependencies = [
  "atomicswap>=0.2.2,<0.3",
  "mergedeep>=1.3.4,<2",
  "packaging>=25.0,<26",
  "platformdirs>=4.9,<5",
  "pydantic>=2.12,<3",
  "pyyaml>=6.0,<7",
]

[dependency-groups]
dev = [
  "pytest>=9.0,<10",
  "pytest-cov>=7.0,<8",
  "ruff>=0.16.5",
  "ty>=0.0.75",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "python_scaffold"
module-root = "src"

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["ASYNC", "B", "C4", "E", "F", "I", "PERF", "PIE", "RUF", "SIM", "UP"]
